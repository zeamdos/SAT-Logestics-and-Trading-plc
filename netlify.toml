[build]
  # Static export publish directory
  publish = "out"
  command = "next build"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["resend"]

# Clean redirect for the dispatch API endpoint
[[redirects]]
  from = "/api/dispatch"
  to = "/.netlify/functions/dispatch"
  status = 200

# Catch-all: serve index.html for all routes so Next.js static export routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
